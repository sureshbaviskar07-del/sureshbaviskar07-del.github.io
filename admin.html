<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suresh Jobs — Admin</title>
<style>body{font-family:Inter,Arial;background:#f6f9fc;color:#14243a;margin:0}.wrap{width:min(1100px,92%);margin:30px auto}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #dfe7ef;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 6px 25px #17385a0a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px;background:#edf5ff;border-radius:12px}.stat b{font-size:25px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #d8e2ec;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:9px;padding:10px 15px;background:#1769e8;color:#fff;font-weight:800;cursor:pointer}.danger{background:#e34d59}.muted{color:#6d7e93;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #edf0f4;padding:13px 0}.pill{background:#eaf4ff;color:#1769e8;border-radius:99px;padding:5px 9px;font-size:11px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr 1fr}.row{display:block}} </style></head>
<body><div class="wrap"><div class="top"><div><h1>Suresh Jobs Admin</h1><p class="muted" id="who">Checking admin access…</p></div><button onclick="location.href='index.html'">Public Site</button></div>
<div id="app" style="display:none"><div class="stats"><div class="stat"><b id="users">0</b><br><span class="muted">Users</span></div><div class="stat"><b id="jobs">0</b><br><span class="muted">Active Jobs</span></div><div class="stat"><b id="views">0</b><br><span class="muted">Visitor Events</span></div><div class="stat"><b id="leads">0</b><br><span class="muted">Employer Leads</span></div></div>
<div class="card"><h2>Post New Job</h2><div class="grid"><input id="title" placeholder="Job title"><input id="company" placeholder="Company"><input id="location" placeholder="City, State"><input id="salary" placeholder="Salary"><select id="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Remote</option></select><input id="url" placeholder="Original application URL"></div><textarea id="desc" rows="7" placeholder="Job description"></textarea><button onclick="addJob()">Publish Job</button><p class="muted" id="jobmsg"></p></div>
<div class="card"><h2>Users — their email addresses</h2><div id="usersList" class="muted">Loading…</div></div>
<div class="card"><h2>Employer Leads</h2><div id="leadList" class="muted">Loading…</div></div>
<div class="card"><h2>Jobs</h2><div id="jobList" class="muted">Loading…</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let sb=null;function configured(){return window.SJ_CONFIG&&!SJ_CONFIG.SUPABASE_URL.startsWith('PASTE_')&&!SJ_CONFIG.SUPABASE_ANON_KEY.startsWith('PASTE_')}async function boot(){if(!configured()){document.getElementById('who').textContent='Add Supabase settings in config.js first.';return}sb=supabase.createClient(SJ_CONFIG.SUPABASE_URL,SJ_CONFIG.SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('who').textContent='Please login first.';return}const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||!p||p.role!=='admin'){document.getElementById('who').textContent='Access denied. Your account is not an admin.';return}document.getElementById('who').textContent='Admin: '+p.email;document.getElementById('app').style.display='block';loadAll()}
async function loadAll(){const [u,j,v,l]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('jobs').select('*').order('created_at',{ascending:false}),sb.from('visitor_events').select('id'),sb.from('employer_leads').select('*').order('created_at',{ascending:false})]);document.getElementById('users').textContent=u.data?.length||0;document.getElementById('jobs').textContent=(j.data||[]).filter(x=>x.active).length;document.getElementById('views').textContent=v.data?.length||0;document.getElementById('leads').textContent=l.data?.length||0;document.getElementById('usersList').innerHTML=(u.data||[]).map(x=>`<div class=row><span>${esc(x.full_name||'User')}</span><span class=pill>${esc(x.email)}</span></div>`).join('')||'No users';document.getElementById('leadList').innerHTML=(l.data||[]).map(x=>`<div class=row><div><b>${esc(x.job_title)}</b><br><span class=muted>${esc(x.company)} · ${esc(x.location)}</span></div><div>${esc(x.name)} · ${esc(x.email)}</div></div>`).join('')||'No leads';document.getElementById('jobList').innerHTML=(j.data||[]).map(x=>`<div class=row><div><b>${esc(x.title)}</b><br><span class=muted>${esc(x.company)} · ${esc(x.location)}</span></div><button class=danger onclick="toggleJob(${x.id},${x.active})">${x.active?'Expire':'Activate'}</button></div>`).join('')||'No jobs'}
async function addJob(){const row={title:v('title'),company:v('company'),location:v('location'),salary:v('salary'),job_type:v('type'),description:v('desc'),application_url:v('url'),active:true};if(Object.values(row).some(x=>x==='')){document.getElementById('jobmsg').textContent='Complete all fields.';return}const {error}=await sb.from('jobs').insert(row);document.getElementById('jobmsg').textContent=error?error.message:'Job published successfully.';if(!error){['title','company','location','salary','desc','url'].forEach(id=>document.getElementById(id).value='');loadAll()}}
async function toggleJob(id,active){await sb.from('jobs').update({active:!active}).eq('id',id);loadAll()}function v(id){return document.getElementById(id).value.trim()}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}boot();
</script></body></html>
